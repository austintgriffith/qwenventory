# Generated values come from data/brain.json via tools/config.sh.
# Don't run xcodegen by hand. Use tools/install-mac.sh.
name: BrainMac
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  BrainMac:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Icon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ${BRAIN_NAME}
        CFBundleName: ${BRAIN_NAME}
        BrainRoot: ${BRAIN_ROOT}
        LSApplicationCategoryType: public.app-category.productivity
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BRAIN_BUNDLE_ID}.mac
        PRODUCT_NAME: ${BRAIN_NAME}
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
