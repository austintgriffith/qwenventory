# Generated values come from data/brain.json via tools/config.sh.
# Don't run xcodegen by hand. Use tools/install-phone.sh.
name: Brain
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0

targets:
  Brain:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
        excludes:
          - "files"
        buildPhase: resources
      - path: Resources/files
        type: folder
        buildPhase: resources
    dependencies:
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXVLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ${BRAIN_NAME}
        BrainAppGroup: ${BRAIN_APP_GROUP}
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Dictate questions instead of typing.
        NSSpeechRecognitionUsageDescription: Transcribes your voice on this device.
    entitlements:
      path: App/Brain.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.security.application-groups:
          - ${BRAIN_APP_GROUP}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BRAIN_BUNDLE_ID}
        PRODUCT_NAME: Brain
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${BRAIN_TEAM_ID}
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
